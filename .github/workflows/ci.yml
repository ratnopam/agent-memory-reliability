name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the suite's only dependency
        run: python -m pip install --quiet -r requirements-dev.txt

      - name: Conformance suite
        run: make test

      - name: Reproduce the results matrix
        run: make reproduce

      # A run whose results are not byte-identical to the run before it cannot support a
      # claim on a poster. This step failing fails the build, on purpose.
      - name: Determinism
        run: make determinism

      - name: Lint
        run: make lint

      - name: No LLM in the measurement path
        run: |
          if grep -rniE '\b(import|from)[[:space:]]+(anthropic|openai|cohere|litellm|langchain|transformers)\b' \
              --include='*.py' harness properties systems taxonomy mcp conftest.py; then
            echo "an LLM client is imported somewhere the suite can reach it"
            exit 1
          fi
          echo "none found"

      - name: The reference implementation imports the standard library only
        run: python .github/check_stdlib_only.py

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --quiet -r requirements-dev.txt
          python -m pip install --quiet -r requirements-mcp.txt

      - name: MCP stdio integration test
        run: python -m pytest mcp/ -v
