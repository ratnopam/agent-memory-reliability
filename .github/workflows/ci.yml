name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Editable, with the test extra. This is also what registers the amr.systems
      # entry point, so CI exercises the discovery path an external adapter would use
      # rather than the in-tree fallback.
      - name: Install
        run: python -m pip install --quiet -e ".[test]"

      - name: Conformance suite
        run: make test

      - name: Reproduce the results matrix
        run: make reproduce

      - name: Contamination simulation
        run: make contamination

      # A run whose results are not byte-identical to the run before it cannot support a
      # claim on a poster. This step failing fails the build, on purpose. It covers the
      # suite and the simulation.
      - name: Determinism
        run: make determinism

      - name: Demo surface still renders
        run: make demo

      - name: Lint
        run: make lint

      - name: No LLM in the measurement path
        run: |
          if grep -rniE '\b(import|from)[[:space:]]+(anthropic|openai|cohere|litellm|langchain|transformers)\b' \
              --include='*.py' src/amr properties systems scenarios examples taxonomy mcp conftest.py; then
            echo "an LLM client is imported somewhere the suite can reach it"
            exit 1
          fi
          echo "none found"

      - name: The reference implementation imports the standard library only
        run: python .github/check_stdlib_only.py

      # The pattern is assembled from two halves so that this file is not itself the match.
      - name: No former name in the tree
        run: |
          if git grep -i -n -e 'mem''ledger'; then
            echo "the pre-rename name is still in a tracked file"
            exit 1
          fi
          echo "none found"

      # `make reproduce` above compares the README against its own fresh run. This compares it
      # against what is committed, which is what a reader who never runs anything actually sees.
      - name: README renders the committed matrix
        run: make drift

      - name: Documentation links resolve
        run: python .github/check_links.py

      # The results document is the artefact the claims are made from, so every matrix
      # leg publishes its own copy and two legs can be diffed against each other.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-py${{ matrix.python-version }}
          path: |
            results/**/raw.json
            results/**/summary.md
            results/**/contamination.json
            results/**/contamination.svg
          if-no-files-found: error

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --quiet -e ".[test,mcp]"

      - name: MCP stdio integration test
        run: python -m pytest mcp/ -v
