name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Editable, with the test extra. This is also what registers the amr.systems
      # entry point, so CI exercises the discovery path an external adapter would use
      # rather than the in-tree fallback.
      - name: Install
        run: python -m pip install --quiet -e ".[test]"

      - name: Conformance suite
        run: make test

      # The producer: `reproduce` and then the simulation, into results/<today>/. Every
      # other target writes outside the tree, so this is the one step that leaves the
      # artefacts the upload step below collects. See docs/RELEASE.md step 2.
      - name: Produce the results
        run: make results

      # A run whose results are not byte-identical to the run before it cannot support a
      # claim on a poster. This step failing fails the build, on purpose. It covers the
      # suite and the simulation.
      - name: Determinism
        run: make determinism

      - name: Demo surface still renders
        run: make demo

      - name: Lint
        run: make lint

      - name: No LLM in the measurement path
        run: |
          if grep -rniE '\b(import|from)[[:space:]]+(anthropic|openai|cohere|litellm|langchain|transformers)\b' \
              --include='*.py' src/amr properties systems scenarios examples taxonomy mcp conftest.py; then
            echo "an LLM client is imported somewhere the suite can reach it"
            exit 1
          fi
          echo "none found"

      - name: The reference implementation imports the standard library only
        run: python .github/check_stdlib_only.py

      # The pattern is assembled from two halves so that this file is not itself the match.
      - name: No former name in the tree
        run: |
          if git grep -i -n -e 'mem''ledger'; then
            echo "the pre-rename name is still in a tracked file"
            exit 1
          fi
          echo "none found"

      # `make reproduce` above compares the README against its own fresh run. This compares it
      # against what is committed, which is what a reader who never runs anything actually sees.
      - name: README renders the committed matrix
        run: make drift

      - name: Documentation links resolve
        run: python .github/check_links.py

      # The architecture diagram is the only document no test reads, and it names source
      # files and counts checks. It named a scope.py this repository never contained.
      - name: The diagram's facts hold
        run: python .github/check_diagram.py

      # The results document is the artefact the claims are made from, so every matrix
      # leg publishes its own copy and two legs can be diffed against each other.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-py${{ matrix.python-version }}
          path: |
            results/**/raw.json
            results/**/summary.md
            results/**/contamination.json
            results/**/contamination.svg
          if-no-files-found: error

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --quiet -e ".[test,mcp]"

      - name: MCP stdio integration test
        run: python -m pytest mcp/ -v

  # The four commands docs/adding-a-system.md promises a stranger, run as a stranger runs
  # them. `properties/test_external_adapter_example.py` covers the same ground with a
  # hand-written dist-info, because the suite is not allowed to reach the network; this
  # job is the only place the real `pip install` of an external adapter happens, with
  # setuptools fetched from an index and the entry point written by the build backend
  # rather than by us. A packaging change that breaks discovery is invisible everywhere
  # else.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the suite
        run: python -m pip install -e ".[test]"

      - name: Install the example adapter, with real pip
        run: python -m pip install -e examples/external-adapter

      # Non-zero on purpose: the example declares less than a conforming system, so it has
      # failures, and the gate asserts they are exactly the five its declaration predicts.
      - name: The example fails exactly what it declares
        run: python .github/check_example_adapter.py
